<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resilience by Design - An Interactive Puzzle </title>
  <meta name="description" content="Explore the pillars and proof points behind resilience by design through an interactive puzzle board." />
  
  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="Resilience by Design — Interactive Puzzle" />
  <meta property="og:description" content="Explore the pillars and proof points behind resilience by design." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="public/favicon.ico" type="image/x-icon" />

  <style>
    :root {
      --brand-bright: oklch(0.655 0.135 240);
      --brand-mid: oklch(0.5 0.135 258);
      --brand-navy: #0b1b3d;
      --brand-navy-dark: #07122b;
      --brand-accent: #00a3e0;
      --brand-accent-hover: #0084b7;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.75);
      --border-light: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(11, 27, 61, 0.82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--brand-navy);
      color: var(--text-main);
      font-family: "Mulish", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
    }

    .hidden {
      display: none !important;
    }

    /* Executive Top Bar */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00a3e0 0%, #005691 100%);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(0, 163, 224, 0.4);
    }

    .brand-text-container {
      display: flex;
      flex-direction: column;
    }

    .brand-text-main {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .brand-text-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Controls Header Group */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .counter-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-light);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .counter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
      transition: background 0.3s ease;
    }

    .counter-dot.empty {
      background: #ffab00;
      box-shadow: 0 0 8px #ffab00;
    }

    .counter-dot.all {
      background: #00a3e0;
      box-shadow: 0 0 8px #00a3e0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00a3e0 0%, #006699 100%);
      border: none;
      box-shadow: 0 2px 10px rgba(0, 163, 224, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1ab0eb 0%, #0077b6 100%);
      box-shadow: 0 4px 14px rgba(0, 163, 224, 0.45);
    }

    .btn:focus-visible {
      outline: 2px solid var(--brand-accent);
      outline-offset: 2px;
    }

    /* Main Container */
    .reference-page {
      flex: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 4.5rem;
      padding-bottom: 3.5rem;
      overflow: hidden;
      background: radial-gradient(circle at center, #11254d 0%, #07122b 100%);
    }

    /* Board Frame & Container */
    .reference-board {
      position: relative;
      width: min(94vw, calc((94vh - 7rem) * 1.77734375));
      aspect-ratio: 1365 / 768;
      overflow: hidden;
      background: var(--brand-navy);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    /* Base Front Image */
    .reference-base {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }

    /* Interactive Puzzle Region Button */
    .reference-region {
      position: absolute;
      display: block;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      animation: reference-assemble 500ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--region-delay, 0ms);
      transform-origin: center;
      will-change: transform, opacity;
      -webkit-tap-highlight-color: transparent;
    }

    .reference-region:focus-visible {
      z-index: 10;
      outline: max(2px, 0.25vw) solid #ffffff;
      outline-offset: calc(max(2px, 0.25vw) * -1);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }

    /* Image Crops */
    .reference-crop {
      position: absolute;
      display: block;
      max-width: none;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
      transition: opacity 280ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    .reference-crop-front {
      opacity: 1;
    }

    .reference-crop-back {
      opacity: 0;
    }

    /* Hover and Revealed States */
    @media (hover: hover) {
      .reference-region:hover .reference-crop-front {
        opacity: 0;
      }

      .reference-region:hover .reference-crop-back {
        opacity: 1;
      }
    }

    .reference-region.is-revealed .reference-crop-front {
      opacity: 0 !important;
    }

    .reference-region.is-revealed .reference-crop-back {
      opacity: 1 !important;
    }

    /* Subtle Border Highlight on Hover/Reveal */
    .reference-region::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0);
      pointer-events: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .reference-region:hover::after,
    .reference-region.is-revealed::after {
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* Keyframe Animations */
    @keyframes reference-assemble {
      from {
        opacity: 0;
        transform: translateY(-8%) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Bottom HUD / Status Bar */
    .app-footer-hud {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.5rem 1.25rem;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      font-size: 0.82rem;
      color: var(--text-muted);
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .hud-label {
      color: #ffffff;
      font-weight: 700;
    }

    .hud-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .reference-region {
        opacity: 1;
        animation: none;
      }
      .reference-crop {
        transition: none;
      }
    }

    /* Responsive Mobile Styling */
    @media (max-width: 640px) {
      .app-header {
        padding: 0.5rem 1rem;
      }
      .brand-text-sub {
        display: none;
      }
      .btn-text {
        display: none;
      }
      .btn {
        padding: 0.4rem 0.6rem;
      }
      .counter-badge {
        padding: 0.35rem 0.6rem;
      }
      .app-footer-hud {
        width: 90%;
        justify-content: center;
        text-align: center;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header Bar -->
  <header class="app-header">
    <div class="brand-title">
      <div class="brand-logo-badge hidden">R</div>
      <div class="brand-text-container">
        <span class="brand-text-main">Resilience by Design</span>
        <span class="brand-text-sub">Interactive Executive Puzzle Board</span>
      </div>
    </div>

    <div class="controls-group">
      <div class="counter-badge" title="Revealed Pieces Count" style="display: none !important;">
        <span id="counterDot" class="counter-dot empty"></span>
        <span id="counterText">0 / 20 Flipped</span>
      </div>

      <button id="btnFlipAll" class="btn btn-primary" type="button" aria-label="Flip all puzzle pieces">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span class="btn-text">Reveal All</span>
      </button>

      <button id="btnReset" class="btn" type="button" aria-label="Reset board to front artwork">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span class="btn-text">Reset</span>
      </button>

      <button id="btnFullscreen" class="btn" type="button" aria-label="Toggle Fullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- Interactive Puzzle Workspace -->
  <main class="reference-page">
    <div class="reference-board" id="board" aria-label="Interactive Resilience by Design puzzle">
      <img
        class="reference-base"
        id="baseImg"
        src="public/images/jigsawpuzzle-front-v2.jpeg"
        alt="Resilience by Design puzzle showing five resilience themes and six key statistics"
        width="1365"
        height="768"
      />
      <!-- Dynamic region buttons are rendered here by JS -->
    </div>
  </main>

  <!-- Bottom Floating Interactive HUD Tooltip -->
  <div class="app-footer-hud" id="hudBar">
    <span class="hud-hint">Interactive Mode</span>
    <span id="hudMessage">Hover or click any puzzle region to reveal hidden strategic details</span>
  </div>

  <script>
    (function () {
      // Primary images paths with automatic relative resolution fallback
      const FRONT_IMG = "public/images/jigsawpuzzle-front-v2.jpeg";
      const BACK_IMG = "public/images/jigsawpuzzle-back-v2.jpeg";

      // Regions definition matching index.tsx exactly
      const regions = [
        { label: "Localized Supply Chain", x: 1, y: 0 },
        { label: "Technology", x: 3, y: 0 },
        { label: "Emergency Planning and Command Centers", x: 4, y: 0 },
        { label: "Domestic Gas Storage", x: 0, y: 1 },
        { label: "Strategic Shipping Fleet", x: 2, y: 1 },
        { label: "Robust Global", x: 3, y: 1 },
        { label: "Restoration and Damage Assessment", x: 4, y: 1 },
        { label: "Critical Spare Parts for Asset Integrity", x: 5, y: 1 },
        { label: "Global Oil Strategic Storage", x: 1, y: 2 },
        { label: "Our People", x: 2, y: 2, w: 2 },
        { label: "9,000 personnel", x: 4, y: 2 },
        { label: "Integrated Hydrocarbon Delivery Chain", x: 0, y: 3 },
        { label: "Operational Flexibility", x: 2, y: 3 },
        { label: "Facility Engineering and Design", x: 3, y: 3 },
        { label: "1,800 firefighters", x: 4, y: 3 },
        { label: "Reverse Engineering in Repair Centers", x: 5, y: 3 },
        { label: "Built-in Spare Production Capacity", x: 0, y: 4 },
        { label: "Multiple Export Routes", x: 1, y: 4 },
        { label: "140 specialty areas", x: 4, y: 4 },
        { label: "Resilience performance statistics", x: 6, y: 2, w: 3, h: 3 },
      ];

      const board = document.getElementById("board");
      const counterText = document.getElementById("counterText");
      const counterDot = document.getElementById("counterDot");
      const btnFlipAll = document.getElementById("btnFlipAll");
      const btnReset = document.getElementById("btnReset");
      const btnFullscreen = document.getElementById("btnFullscreen");
      const hudMessage = document.getElementById("hudMessage");

      let regionElements = [];
      let allFlippedState = false;

      // Check image loading fallback if file is opened from alternate path
      const imgTester = new Image();
      let actualFrontImg = FRONT_IMG;
      let actualBackImg = BACK_IMG;

      imgTester.onerror = function () {
        actualFrontImg = "images/jigsawpuzzle-front.jpeg";
        actualBackImg = "images/jigsawpuzzle-back.jpeg";
        document.getElementById("baseImg").src = actualFrontImg;
        renderBoard();
      };

      imgTester.onload = function () {
        renderBoard();
      };
      imgTester.src = FRONT_IMG;

      function updateCounter() {
        const flippedCount = regionElements.filter(el => el.classList.contains("is-revealed")).length;
        const total = regions.length;
        counterText.textContent = `${flippedCount} / ${total} Flipped`;

        counterDot.className = "counter-dot";
        if (flippedCount === 0) {
          counterDot.classList.add("empty");
          btnFlipAll.querySelector(".btn-text").textContent = "Reveal All";
        } else if (flippedCount === total) {
          counterDot.classList.add("all");
          btnFlipAll.querySelector(".btn-text").textContent = "Hide All";
          allFlippedState = true;
        } else {
          btnFlipAll.querySelector(".btn-text").textContent = "Reveal All";
          allFlippedState = false;
        }
      }

      function renderBoard() {
        // Clear existing region elements
        const existing = board.querySelectorAll(".reference-region");
        existing.forEach(el => el.remove());
        regionElements = [];

        regions.forEach((region, index) => {
          const w = region.w ?? 1;
          const h = region.h ?? 1;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "reference-region";
          btn.setAttribute("aria-label", `Reveal details for ${region.label}`);
          btn.setAttribute("aria-pressed", "false");

          // Inline styling for region position and staggered entrance animation
          btn.style.left = `${(region.x / 9) * 100}%`;
          btn.style.top = `${(region.y / 5) * 100}%`;
          btn.style.width = `${(w / 9) * 100}%`;
          btn.style.height = `${(h / 5) * 100}%`;
          btn.style.setProperty("--region-delay", `${120 + index * 32}ms`);

          // Mathematical cropping styles for front and back images
          const cropWidth = `${(9 / w) * 100}%`;
          const cropHeight = `${(5 / h) * 100}%`;
          const cropLeft = `${(-region.x / w) * 100}%`;
          const cropTop = `${(-region.y / h) * 100}%`;

          // Front Crop Image
          const imgFront = document.createElement("img");
          imgFront.className = "reference-crop reference-crop-front";
          imgFront.src = actualFrontImg;
          imgFront.alt = "";
          imgFront.style.width = cropWidth;
          imgFront.style.height = cropHeight;
          imgFront.style.left = cropLeft;
          imgFront.style.top = cropTop;

          // Back Crop Image
          const imgBack = document.createElement("img");
          imgBack.className = "reference-crop reference-crop-back";
          imgBack.src = actualBackImg;
          imgBack.alt = "";
          imgBack.style.width = cropWidth;
          imgBack.style.height = cropHeight;
          imgBack.style.left = cropLeft;
          imgBack.style.top = cropTop;

          btn.appendChild(imgFront);
          btn.appendChild(imgBack);

          // Click handler to toggle flip state
          btn.addEventListener("click", () => {
            const isFlipped = btn.classList.toggle("is-revealed");
            btn.setAttribute("aria-pressed", isFlipped ? "true" : "false");
            updateCounter();
          });

          // Mouse hover HUD message update
          btn.addEventListener("mouseenter", () => {
            hudMessage.textContent = `Region: ${region.label} — Click to toggle pin`;
          });

          btn.addEventListener("mouseleave", () => {
            hudMessage.textContent = "Hover or click any puzzle region to reveal hidden strategic details";
          });

          // Focus accessibility HUD message update
          btn.addEventListener("focus", () => {
            hudMessage.textContent = `Region: ${region.label} (Press Space or Enter to flip)`;
          });

          btn.addEventListener("blur", () => {
            hudMessage.textContent = "Hover or click any puzzle region to reveal hidden strategic details";
          });

          board.appendChild(btn);
          regionElements.push(btn);
        });

        updateCounter();
      }

      // Batch Action: Flip All / Hide All
      btnFlipAll.addEventListener("click", () => {
        allFlippedState = !allFlippedState;
        regionElements.forEach(btn => {
          if (allFlippedState) {
            btn.classList.add("is-revealed");
            btn.setAttribute("aria-pressed", "true");
          } else {
            btn.classList.remove("is-revealed");
            btn.setAttribute("aria-pressed", "false");
          }
        });
        updateCounter();
      });

      // Batch Action: Reset
      btnReset.addEventListener("click", () => {
        allFlippedState = false;
        regionElements.forEach(btn => {
          btn.classList.remove("is-revealed");
          btn.setAttribute("aria-pressed", "false");
        });
        updateCounter();
      });

      // Action: Fullscreen Toggle
      btnFullscreen.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable fullscreen: ${err.message}`);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });
    })();
  </script>
</body>
</html>
